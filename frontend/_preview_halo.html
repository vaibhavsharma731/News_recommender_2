<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halo Widget Preview — throwaway</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/tabs.css" />
  <style>
    body { background: var(--bg-base); padding: 28px; }
    .preview-wrap { max-width: 1000px; margin: 0 auto; }
    .preview-note { font-size: .8rem; color: var(--text-muted); margin-bottom: 18px; }
  </style>
</head>
<body>
  <div class="preview-wrap">
    <div class="preview-note">
      Static design preview (mock data, no backend). Delete this file anytime.
    </div>
    <div class="feed-explainer">
      <span class="feed-explainer-item"><span class="source-chip source-chip-pre">⚡ Precomputed</span> hybrid + rerank</span>
      <span class="feed-explainer-item"><span class="source-chip source-chip-live">🛰️ Live</span> other modes</span>
    </div>
    <div id="article-feed" class="article-feed"></div>
  </div>

<script>
  const SECTIONS = ['Politics','Sports','Technology','Business','World','Health'];
  const EMOJI = { Politics:'🗳️', Sports:'🏅', Technology:'💻', Business:'💼', World:'🌍', Health:'🩺' };
  const TITLES = [
    'Supreme Court orders review of electoral bond disclosures',
    'India clinches series with a last-over thriller in Mumbai',
    'New AI rules spark debate among Indian startups',
    'Rupee steadies as markets await budget signals',
    'Monsoon forecast lifts hopes for kharif sowing season',
    'Health ministry rolls out expanded vaccination drive',
    'Parliament panel seeks data on rural jobs scheme',
    'Olympic hopefuls begin camp ahead of qualifiers',
    'Chipmaker announces $2bn plant in southern India',
    'Centre reviews inflation as food prices cool off',
    'Border talks resume after a month-long pause',
    'Cities pilot electric bus fleets to cut emissions'
  ];

  function tile(i, score) {
    const sec = SECTIONS[i % SECTIONS.length];
    return `<div class="orbit-tile clickable">
      <div class="orbit-tile-thumb"><div class="orbit-tile-fallback">${EMOJI[sec]}</div>
        <span class="orbit-score">${score}%</span></div>
      <div class="orbit-tile-body">
        <div class="orbit-tile-section">${sec}</div>
        <div class="orbit-tile-title">${TITLES[i % TITLES.length]}</div>
      </div>
    </div>`;
  }

  function widget(mainIndex, recCount, chip) {
    const sec = SECTIONS[mainIndex % SECTIONS.length];
    const order = ['top','bottom','left','right'];
    const buckets = { top:'', bottom:'', left:'', right:'' };
    for (let i = 0; i < recCount; i++) {
      buckets[order[i % 4]] += tile(mainIndex + i + 1, 96 - i * 4);
    }
    return `
      <article class="feed-widget">
        <div class="feed-widget-head">
          <span class="feed-recs-title">✦ Around this story</span>
          <span>${chip}</span>
        </div>
        <div class="orbit-stage">
          <div class="orbit-slot orbit-slot-top">${buckets.top}</div>
          <div class="orbit-slot orbit-slot-left">${buckets.left}</div>
          <div class="orbit-main">
            <div class="orbit-main-thumb"><div class="orbit-main-fallback">${EMOJI[sec]}</div></div>
            <div class="orbit-main-body">
              <div class="orbit-main-section" style="color:var(--brand-primary)">${sec.toUpperCase()}</div>
              <h3 class="orbit-main-title">${TITLES[mainIndex % TITLES.length]}</h3>
              <div class="orbit-main-meta"><span>📅 12 Oct 2026</span><a class="feed-read-link" href="#">📖 Read story</a></div>
            </div>
          </div>
          <div class="orbit-slot orbit-slot-right">${buckets.right}</div>
          <div class="orbit-slot orbit-slot-bottom">${buckets.bottom}</div>
        </div>
      </article>`;
  }

  document.getElementById('article-feed').innerHTML =
    widget(0, 10, '<span class="source-chip source-chip-pre">⚡ Precomputed</span>') +
    widget(3, 6,  '<span class="source-chip source-chip-pre">⚡ Precomputed</span>') +
    widget(6, 4,  '<span class="source-chip source-chip-live">🛰️ Live</span>');
</script>
</body>
</html>
